[package]
name = "serialport"
version = "0.1.0"
description = "A serial port app"
authors = ["tangxiangong <tangxiangong@gmail.com>"]
edition = "2024"

[lib]
name = "serialport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
btleplug = "0.12.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-serial = "5.4.5"
tokio-stream = "0.1"
tokio-util = "0.7"
uuid = "1"
