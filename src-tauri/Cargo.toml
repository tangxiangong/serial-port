[package]
name = "serialport"
version = "0.1.0"
description = "A serial port app"
authors = ["tangxiangong <tangxiangong@gmail.com>"]
edition = "2024"

[lib]
name = "serialport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1"
chrono = "0.4"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12", features = [] }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-serial = "5.4"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
