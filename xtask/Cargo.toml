[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.38"
sha2 = "0.10"
ed25519-dalek = "2.2"

[dev-dependencies]
tempfile = "3"
