[package]
name = "serial-studio-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared serial transport, encoding and release policy for the native Serial Studio clients"

[lib]
name = "serial_studio_core"
crate-type = ["rlib"]

[dependencies]
anyhow = "1"
chrono = "0.4"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interoptopus = { version = "0.16", optional = true }
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-serial = "5.4"


[features]
csharp = ["dep:interoptopus"]
