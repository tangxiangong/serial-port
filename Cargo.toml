[package]
authors = ["tangxiangong <tangxiangong@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
name = "serial-port"
version = "0.1.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
btleplug = "0.12.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "runtime_shaders",
    "wayland",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-serial = "5.4.5"
tokio-stream = "0.1"
tokio-util = "0.7"
uuid = "1"
