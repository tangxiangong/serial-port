name: Native checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p serial-studio-core -p serial-studio-csharp -p xtask --lib
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: ./macos/build.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@stable
      - shell: pwsh
        run: ./windows/scripts/build.ps1 -Architecture x64
